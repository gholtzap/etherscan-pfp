<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Icon Type Selector</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 15px;
      background-color: #f5f7fa;
      color: #333;
      width: 250px;
    }

    .container {
      background-color: #ffffff;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
      padding: 20px;
    }

    .container h1 {
      font-size: 18px;
      margin: 0 0 15px;
      text-align: center;
      color: #4a90e2;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }

    select {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      outline: none;
      transition: border-color 0.2s;
    }

    select:focus,
    select:hover {
      border-color: #4a90e2;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Choose Icon Type</h1>
    <label for="icon-type">Select Icon Type:</label>
    <select id="icon-type">
      <option value="mandala">Mandala</option>
      <option value="identicon">Identicon</option>
    </select>
  </div>
  <script src="popup.js"></script>
</body>

</html>
